server.port=8081
spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/heartz_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${AUTH_DB_USER:root}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}